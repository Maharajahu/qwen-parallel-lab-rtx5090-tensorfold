<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060b16;color:#f0e8d7;font:14px Georgia,serif;overflow:hidden}canvas{display:block;width:100%;height:100%}button{font:inherit;color:inherit;background:#101a28dd;border:1px solid #b9985944;border-radius:7px;padding:10px 14px;cursor:pointer}button:hover,button:focus-visible{border-color:#d2b271;background:#243347}#ui{position:fixed;inset:0;pointer-events:none}header{position:absolute;left:32px;top:25px;max-width:440px;text-shadow:0 2px 12px #000}header small{font:10px system-ui;letter-spacing:.28em;color:#c8aa70}h1{font-size:clamp(26px,3.6vw,48px);font-weight:400;letter-spacing:.02em;margin:12px 0 7px}#subtitle{font:13px/1.5 system-ui;color:#b7c0c9;max-width:340px}#actions{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;max-width:95vw;flex-wrap:wrap;justify-content:center}#hint{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);font:11px system-ui;color:#bac3ca;text-align:center;white-space:nowrap}#info{display:none;position:absolute;right:25px;top:25px;max-width:290px;background:#0b1425e8;border:1px solid #b9985966;padding:20px;border-radius:10px;font:14px/1.5 system-ui;pointer-events:auto}#info h2{font-family:Georgia;margin-top:0;color:#ddc48d}#error{display:none;position:fixed;top:0;left:0;right:0;padding:15px;background:#6b1028;z-index:20;font:13px monospace;white-space:pre-wrap}@media(max-width:600px){header{left:20px;top:20px;max-width:80vw}#actions{bottom:15px}#hint{bottom:110px}#info{top:auto;bottom:125px;right:15px;max-width:260px}}
</style></head><body><div id="error" role="alert"></div><div id="ui"><header><small>AN INTERACTIVE WORLD</small><h1>__TITLE__</h1><div id="subtitle"></div></header><div id="info"></div><div id="hint">Drag to explore · Scroll to zoom · Select a landmark</div><div id="actions"></div></div>
<script type="importmap">__IMPORTMAP__</script>
<script type="module">
import * as THREE from 'three';
import {Reflector} from 'three-reflector';
__GEOMETRY_SDK__
__WATER_SDK__
const plan=__CONFIG__;
const errors=[];window.__fanout={errors,parts:[],components:[],frames:0,ready:false};
function fail(error){errors.push(String(error?.stack||error));const box=document.getElementById('error');box.style.display='block';box.textContent=errors.join('\n');console.error(error)}
window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));
const scene=new THREE.Scene();scene.background=new THREE.Color(plan.palette.sky||'#14243c');scene.fog=new THREE.FogExp2(plan.palette.sky||'#14243c',.0015);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1500);camera.position.set(...plan.camera);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc3dcff,0x454650,2.1));const moon=new THREE.DirectionalLight(0xffe2bb,3.7);moon.position.set(-45,90,55);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);Object.assign(moon.shadow.camera,{left:-65,right:65,top:75,bottom:-55,near:1,far:220});moon.shadow.bias=-.0003;moon.shadow.normalBias=.08;scene.add(moon);const fill=new THREE.DirectionalLight(0x7ea9ed,1.9);fill.position.set(60,35,-35);scene.add(fill);
document.getElementById('subtitle').textContent=plan.subtitle;
const updates=[],hotspots=[],state={paused:false,time:0,selected:null};
function registerAction(label,fn){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>{try{fn()}catch(e){fail(e)}});document.getElementById('actions').append(b);return b}
const ctx={THREE,palette:plan.palette,state,site:plan.site,geometry:createGeometrySDK(THREE),addUpdate:fn=>updates.push(fn),registerAction,addHotspot:(mesh,title,description)=>hotspots.push({mesh,title,description})};
ctx.makeWater=createWaterFactory(THREE,Reflector,plan.palette,ctx.addUpdate);
__PARTS__
for(const [id,fn]of[part0,part1,part2,part3,part4,part5,part6,part7].entries()){try{const group=new THREE.Group();group.name=plan.parts[id].name;group.position.set(...plan.parts[id].origin);scene.add(group);let seed=173+id*101;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};fn({...ctx,scene:group,part:plan.parts[id],random,addHotspot:(mesh,title,description)=>{const m=mesh.material;const hidden=m&&(m.visible===false||(m.transparent&&m.opacity<.01));ctx.addHotspot(hidden?group:mesh,title,description)}});let meshes=0,lights=0;group.traverse(o=>{if(o.isMesh){meshes++;if(id<5){o.castShadow=true;o.receiveShadow=true}}if(o.isLight)lights++});const bounds=new THREE.Box3().setFromObject(group);if(bounds.isEmpty())throw Error('Empty component '+id);if(![...bounds.min.toArray(),...bounds.max.toArray()].every(Number.isFinite))throw Error('Invalid bounds '+id);window.__fanout.components.push({id,meshes,lights,min:bounds.min.toArray(),max:bounds.max.toArray()});window.__fanout.parts.push(id)}catch(e){fail(e)}}
const target=new THREE.Vector3(...plan.lookAt),initial=camera.position.clone(),offset=initial.clone().sub(target),spherical=new THREE.Spherical().setFromVector3(offset);
let dragging=false,moved=0,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;moved+=Math.abs(dx)+Math.abs(dy);spherical.theta-=dx*.004;spherical.phi=THREE.MathUtils.clamp(spherical.phi+dy*.004,.15,1.48);lastX=e.clientX;lastY=e.clientY;updateCamera()});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('pointerup',e=>{dragging=false;if(moved>5)return;mouse.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(hotspots.map(h=>h.mesh),true);if(!hits.length)return;let item=hits[0].object;let selected;while(item&&!selected){selected=hotspots.find(h=>h.mesh===item);item=item.parent}if(selected){state.selected=selected.title;const info=document.getElementById('info');info.replaceChildren();const h=document.createElement('h2');h.textContent=selected.title;const p=document.createElement('p');p.textContent=selected.description;const close=document.createElement('button');close.textContent='Close';close.onclick=()=>info.style.display='none';info.append(h,p,close);info.style.display='block'}});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();spherical.radius=THREE.MathUtils.clamp(spherical.radius*Math.exp(e.deltaY*.001),15,250);updateCamera()},{passive:false});
renderer.domElement.style.touchAction='none';
function updateCamera(){camera.position.copy(target).add(new THREE.Vector3().setFromSpherical(spherical));camera.lookAt(target)}updateCamera();
const pause=registerAction('Pause motion',()=>{state.paused=!state.paused;pause.textContent=state.paused?'Resume motion':'Pause motion'});registerAction('Reset view',()=>{spherical.setFromVector3(offset);updateCamera()});const fullscreen=registerAction('Fullscreen',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{fullscreen.textContent='Fullscreen unavailable';fullscreen.title='This browser did not grant fullscreen access.'}});document.addEventListener('fullscreenchange',()=>{fullscreen.textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen'});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let previous=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-previous)/1000,.05);previous=now;if(!state.paused){state.time+=dt;for(const fn of updates){try{fn(dt,state.time)}catch(e){fail(e);state.paused=true;break}}}renderer.render(scene,camera);window.__fanout.frames++;window.__fanout.ready=errors.length===0&&window.__fanout.parts.length===8;window.__fanout.drawCalls=renderer.info.render.calls;window.__fanout.triangles=renderer.info.render.triangles;if(window.__fanout.frames===60)console.info('FANOUT_RENDER_RECEIPT '+JSON.stringify(window.__fanout))}requestAnimationFrame(frame);
</script></body></html>
